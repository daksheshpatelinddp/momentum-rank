name: Multi-scenario backtest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momentum-backtest2
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Self-test (offline)
        run: python selftest.py

      - name: Check price data exists
        run: |
          if [ ! -f data/history.csv ]; then
            echo "::error::data/history.csv not found. Run the 'Download backtest price data' workflow first (only needed once; it resumes on later runs)."
            exit 1
          fi
          echo "Using existing data/history.csv ($(wc -l < data/history.csv) rows) - no download here."

      - name: Run scenarios
        run: python backtest2.py

      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update backtest scenario results"
            git pull --rebase --autostash
            git push
          fi
