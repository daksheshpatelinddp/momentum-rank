name: Momentum rank

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild all price history from scratch (slow, about 15 min)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [symbols.txt]
  schedule:
    - cron: "30 4 * * 6"

permissions:
  contents: write

concurrency:
  group: momentum-rank
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Self-test (offline)
        run: python selftest.py

      - name: Download NSE bhavcopy
        env:
          REBUILD: ${{ inputs.rebuild || 'false' }}
        run: python fetch_bhav.py

      - name: Rank stocks
        run: python rank.py

      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update prices and ranking"
            git pull --rebase --autostash
            git push
          fi
